# Render Blueprint Specification for CrimeGraph AI
# https://render.com/docs/blueprint-spec

services:
  # ─── Backend: FastAPI Web Service ───────────────────────────────────
  - type: web
    name: crimegraph-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt &&
      python -m spacy download en_core_web_sm
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crimegraph-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false  # Set after frontend deploys: https://crimegraph-frontend.onrender.com
      - key: CORS_ORIGIN_REGEX
        value: ^https:\/\/.*\.onrender\.com$
      - key: ENABLE_DEMO_USERS
        value: "true"
      - key: AUTO_SEED_DEMO_DATA
        value: "true"
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
      - key: PYTHON_VERSION
        value: "3.11.7"

  # ─── Frontend: React/Vite Static Site ───────────────────────────────
  - type: web
    name: crimegraph-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # Set to: https://crimegraph-backend.onrender.com

# ─── Database: PostgreSQL ─────────────────────────────────────────────
databases:
  - name: crimegraph-db
    region: oregon
    plan: free
    databaseName: crimegraph
    user: crimegraph
